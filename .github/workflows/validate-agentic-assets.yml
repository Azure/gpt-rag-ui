name: Validate agentic engineering assets

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
      - "docs/agentic-engineering.md"
  push:
    branches:
      - develop
      - main
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
      - "docs/agentic-engineering.md"

permissions:
  contents: read

concurrency:
  group: validate-agentic-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/scripts/requirements.txt"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
