name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-quality.txt
          python -m pip install --no-deps -e .
      - name: Run existing unittest suite including installed wheel acceptance
        run: python -m unittest discover -s tests -p "test_*.py" -v

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typing, architecture, exceptions, policy]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Select protected-base evaluator and tool pins
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:.github/scripts/check-quality.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/check-quality.py" > "$RUNNER_TEMP/check-quality.py"
            git show "$BASE_SHA:requirements-quality.txt" > "$RUNNER_TEMP/requirements-quality.txt"
          else
            # Bootstrap is explicitly a policy violation, not self-approved enforcement.
            cp .github/scripts/check-quality.py "$RUNNER_TEMP/check-quality.py"
            cp requirements-quality.txt "$RUNNER_TEMP/requirements-quality.txt"
          fi
          python -m pip install -r "$RUNNER_TEMP/requirements-quality.txt"
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Evaluate candidate against protected minimum
        run: python "$RUNNER_TEMP/check-quality.py" --check "${{ matrix.check }}" --base-ref "$BASE_SHA" --report ".artifacts/${{ matrix.check }}.json"
      - name: Retain bound report even when checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.check }}
          path: .artifacts/${{ matrix.check }}.json
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      TEST_RESULT: ${{ needs.unit-tests.result }}
    steps:
      - name: Check out evaluation inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download every quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-*
          path: .artifacts/reports
          merge-multiple: true
      - name: Reject failed, skipped, missing or stale execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          checks = ("lint", "typing", "architecture", "exceptions", "policy")
          if os.environ["QUALITY_RESULT"] != "success" or os.environ["TEST_RESULT"] != "success":
              raise SystemExit("Quality matrix and unit-tests must both succeed")
          for name in checks:
              report = json.loads(Path(f".artifacts/reports/{name}.json").read_text())
              assert report["head_sha"] == os.environ["HEAD_SHA"], "stale head"
              assert report["base_sha"] == os.environ["BASE_SHA"], "wrong base"
              assert report["policy_sha"] == os.environ["BASE_SHA"], "unapproved bootstrap"
              assert report["status"] == "passed", name
              assert report["checks"][name]["status"] == "passed", name
          PY
